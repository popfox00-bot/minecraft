name: Deploy to GitHub Pages

# The cubiomes WASM module is committed (src/wasm/cubiomes.js), so CI only
# needs Node — no Emscripten.
on:
  push:
    branches: [main]
  # If Pages is still set to "Deploy from a branch", GitHub's own branch build
  # runs on every push and publishes the raw (unbuilt) source. Re-deploy the
  # built app after it finishes so ours is always the last deploy.
  page_build:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
